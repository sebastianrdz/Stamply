name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  # Pinned to match the pnpm version used locally (pnpm-lock.yaml lockfileVersion 9.0).
  PNPM_VERSION: "10.15.1"

# Cancel superseded runs on the same ref so main doesn't queue stale CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint -> typecheck -> test -> build, in one job so each blocking check runs
  # sequentially against the same cached install and fails fast on the first
  # broken step. All four steps are required (no continue-on-error).
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # End-to-end tests via Playwright. Kept as a separate job so it runs in its
  # own clean runner with browser binaries, after the fast checks above pass.
  #
  # NON-BLOCKING (continue-on-error: true) for now: both apps have their own
  # playwright.config.ts (app on :3100 against a non-resolving fake Supabase so
  # it fails closed; marketing on :3101, backend-free) and pass locally, but the
  # CI browser-install/boot path hasn't been proven on a runner yet. Rather than
  # block every PR on it, this job may fail without failing the run. Flip
  # `continue-on-error` to `false` once a green run has been observed on `main`.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Playwright now lives in the app/marketing packages (monorepo), not at the
      # workspace root, so scope these to a package that has it. Both suites use
      # the chromium project only, and browsers install to a shared cache that
      # the marketing run reuses.
      - name: Install Playwright browsers (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @stamply/app exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @stamply/app exec playwright install-deps chromium

      - name: Run Playwright tests (app)
        run: pnpm --filter @stamply/app test:e2e

      - name: Run Playwright tests (marketing)
        run: pnpm --filter @stamply/marketing test:e2e
